{% extends "thempblast/base.html" %}

{% block content %}

<style>
/* ============================================================
       CATEGORY PAGE
       ============================================================ */
    .category-page {
      padding: var(--space-7) 0 var(--space-8);
    }

    .category-intro {
      margin-bottom: var(--space-5);
    }

    .category-intro h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .category-intro p {
      color: var(--mpb-mid-gray);
      margin: 0;
      font-size: 14px;
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 10px;
      scrollbar-width: thin;
      margin-bottom: var(--space-5);
    }

    .category-tab {
      flex: 0 0 auto;
      border: 1px solid var(--mpb-border-gray);
      background: #fff;
      color: var(--mpb-dark-gray);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .category-tab:hover,
    .category-tab.active {
      background: var(--mpb-red);
      border-color: var(--mpb-red);
      color: #fff;
    }

    .category-count {
      color: var(--mpb-mid-gray);
      font-size: 13px;
      margin-bottom: var(--space-4);
    }

    @media (min-width: 768px) {
      .category-intro h1 {
        font-size: 34px;
      }
    }
</style>

<section class="category-page">
      <div class="container-fluid px-page">
        <div class="category-intro">
          <h1 id="categoryTitle">सभी खबरें</h1>
          <p id="categoryDescription">THE MP BLAST की विषयवार ताज़ा खबरें एक ही जगह।</p>
        </div>

        <nav class="category-tabs" aria-label="समाचार श्रेणियाँ">
          <a class="category-tab" data-category="all" href="/category/">सभी खबरें</a>
          <a class="category-tab" data-category="national" href="/category/?category=national">राष्ट्रीय</a>
          <a class="category-tab" data-category="politics" href="/category/?category=politics">राजनीति</a>
          <a class="category-tab" data-category="crime" href="/category/?category=crime">अपराध</a>
          <a class="category-tab" data-category="education" href="/category/?category=education">शिक्षा व रोज़गार</a>
          <a class="category-tab" data-category="business" href="/category/?category=business">व्यापार</a>
          <a class="category-tab" data-category="sports" href="/category/?category=sports">खेल</a>
          <a class="category-tab" data-category="entertainment" href="/category/?category=entertainment">मनोरंजन</a>
          <a class="category-tab" data-category="mp" href="/category/?category=mp">मध्य प्रदेश</a>
        </nav>

        <div class="category-count" id="categoryCount"></div>
        <div class="grid-auto" id="categoryNewsSlot"></div>
      </div>
    </section>

{% endblock %}

      return String(num);
    }
    function catClass(cat) { return `cat-${cat}`; }

    function tplStandard(item) {
      return `
        <a href="article.html" class="card-mpb hover-lift text-decoration-none">
          <div class="thumb">
            <img src="${item.image}" alt="${item.headline}" loading="lazy">
            <span class="badge-cat ${catClass(item.category)}">${item.catLabel}</span>
            ${item.isBreaking ? `<span class="badge-live"><span class="dot"></span>LIVE</span>` : ``}
          </div>
          <div class="body">
            <h2 class="headline">${item.headline}</h2>
            <p class="summary">${item.summary || ''}</p>
            <div class="meta-row">
              <span class="loc"><i class="bi bi-geo-alt"></i>${item.district}</span>
              <span>${item.timestamp}</span>
            </div>
            <div class="meta-row">
              <span class="stat-row"><span><i class="bi bi-eye-fill"></i> ${fmtNum(item.views)}</span></span>
            </div>
          </div>
        </a>`;
    }

    function setTodayDate() {
      const el = document.getElementById('todayDate');
      if (!el) return;
      const days = ["रविवार", "सोमवार", "मंगलवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
      const months = ["जनवरी", "फ़रवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"];
      const d = new Date();
      el.textContent = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function renderTicker() {
      const breaking = NEWS.filter(x => x.isBreaking);
      const pool = breaking.length ? breaking : NEWS.slice(0, 5);
      const track = document.getElementById('tickerTrack');
      const sep = '<span aria-hidden="true" style="opacity:.6;">●</span>';
      const items = pool.map(item => `<a href="article.html">${item.headline}</a>`).join(sep);
      track.innerHTML = items + sep + items;
      document.getElementById('tickerClose').addEventListener('click', () => {
        document.getElementById('tickerWrap').style.display = 'none';
      });
    }

    function initBackToTop() {
      const btn = document.getElementById('backToTop');
      window.addEventListener('scroll', () => btn.classList.toggle('show', window.scrollY > 500));
      btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    }

    function renderCategory() {
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('category') || 'all';
      const category = Object.prototype.hasOwnProperty.call(CATEGORY_META, requested) ? requested : 'all';
      const meta = CATEGORY_META[category];
      const items = category === 'all' ? [...NEWS].sort((a, b) => b.views - a.views) : NEWS.filter(x => x.category === category);

      document.getElementById('categoryTitle').textContent = meta.title;
      document.getElementById('categoryDescription').textContent = meta.description;
      document.getElementById('categoryCount').textContent = `${items.length} खबरें`;
      document.getElementById('categoryNewsSlot').innerHTML = items.length
        ? items.map(tplStandard).join('')
        : '<div class="col-12"><div class="alert alert-light border">इस श्रेणी में अभी कोई खबर उपलब्ध नहीं है।</div></div>';

      document.querySelectorAll('.category-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.category === category);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTodayDate();
      renderTicker();
      renderCategory();
      initBackToTop();
    });
</script>
{% endblock %}
