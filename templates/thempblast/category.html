{% extends "thempblast/base.html" %}

{% block content %}

<style>
  /* ============================================================
     CATEGORY PAGE
     ============================================================ */

  .category-page {
    padding: var(--space-7) 0 var(--space-8);
  }

  .category-intro {
    margin-bottom: var(--space-5);
  }

  .category-intro h1 {
    font-size: 28px;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .category-intro p {
    color: var(--mpb-mid-gray);
    margin: 0;
    font-size: 14px;
  }

  .category-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0 10px;
    scrollbar-width: thin;
    margin-bottom: var(--space-5);
  }

  .category-tab {
    flex: 0 0 auto;
    border: 1px solid var(--mpb-border-gray);
    background: #fff;
    color: var(--mpb-dark-gray);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    text-decoration: none;
  }

  .category-tab:hover,
  .category-tab.active {
    background: var(--mpb-red);
    border-color: var(--mpb-red);
    color: #fff;
  }

  .category-count {
    color: var(--mpb-mid-gray);
    font-size: 13px;
    margin-bottom: var(--space-4);
  }

  @media (min-width: 768px) {
    .category-intro h1 {
      font-size: 34px;
    }
  }
</style>

<section class="category-page">
  <div class="container-fluid px-page">

    <!-- CATEGORY HEADER -->
    <div class="category-intro">
      <h1 id="categoryTitle">लोड हो रहा है...</h1>

      <p id="categoryDescription">
        खबरें लोड हो रही हैं...
      </p>
    </div>

    <!-- CATEGORY TABS -->
    <!--
      These are intentionally static for this stage.
      We will make them dynamic from Django Admin later.
    -->
    <nav
    class="category-tabs"
    id="categoryTabs"
    aria-label="समाचार श्रेणियाँ"
>
    <a
        class="category-tab"
        data-category="all"
        href="/category/"
    >
        सभी खबरें
    </a>
</nav>

    <!-- ARTICLE COUNT -->
    <div
      class="category-count"
      id="categoryCount"
    ></div>

    <!-- DYNAMIC ARTICLE GRID -->
    <div
      class="grid-auto"
      id="categoryNewsSlot"
    >
      <div class="col-12">
        <div class="alert alert-light border">
          खबरें लोड हो रही हैं...
        </div>
      </div>
    </div>

  </div>
</section>

{% endblock %}


{% block extra_js %}

<script>
  /* ============================================================
     CATEGORY PAGE
     Dynamic API-driven implementation
     ============================================================ */


  /* ------------------------------------------------------------
     Prevent placeholder "#" links from jumping to page top
     ------------------------------------------------------------ */

  document.addEventListener('click', function (e) {
    const link = e.target.closest('a[href="#"]');

    if (link) {
      e.preventDefault();
    }
  });


  /* ============================================================
     CATEGORY SLUG
     
     Examples:

     /category/
     -> ""

     /category/mp/
     -> "mp"

     /category/politics/
     -> "politics"
     ============================================================ */

  function getCategorySlug() {

    const parts = window.location.pathname
      .split('/')
      .filter(Boolean);

    if (parts[0] !== 'category') {
      return '';
    }

    return parts[1] || '';
  }


  /* ============================================================
     FETCH CATEGORY
     ============================================================ */

  async function fetchCategory(slug) {

    const url = slug
      ? `/api/categories/${encodeURIComponent(slug)}/`
      : `/api/categories/`;

    const response = await fetch(url, {
      method: 'GET',
      credentials: 'same-origin',
      headers: {
        'Accept': 'application/json'
      }
    });

    if (!response.ok) {
      throw new Error(
        `Category API returned HTTP ${response.status}`
      );
    }

    return await response.json();
  }


  /* ============================================================
     FETCH CATEGORY ARTICLES
     ============================================================ */

  async function fetchCategoryArticles(slug) {

    if (!slug) {
      return [];
    }

    const url =
      `/api/categories/${encodeURIComponent(slug)}/articles/`;

    const response = await fetch(url, {
      method: 'GET',
      credentials: 'same-origin',
      headers: {
        'Accept': 'application/json'
      }
    });

    if (!response.ok) {
      throw new Error(
        `Category articles API returned HTTP ${response.status}`
      );
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(
        'Category articles API returned an unsuccessful response.'
      );
    }

    return data.items || [];
  }

  async function fetchAllArticles() {

    const response = await fetch(
        '/api/articles/',
        {
            method: 'GET',
            credentials: 'same-origin',
            headers: {
                'Accept': 'application/json'
            }
        }
    );

    if (!response.ok) {
        throw new Error(
            `Articles API returned HTTP ${response.status}`
        );
    }

    const data = await response.json();

    if (!data.success) {
        throw new Error(
            'Articles API returned an unsuccessful response.'
        );
    }

    return data.items || [];
}


  /* ============================================================
     NUMBER FORMATTER
     ============================================================ */

  function fmtNum(num) {

    num = Number(num) || 0;

    if (num >= 100000) {
      return (
        (num / 100000)
          .toFixed(1)
          .replace('.0', '')
        + 'L'
      );
    }

    if (num >= 1000) {
      return (
        (num / 1000)
          .toFixed(1)
          .replace('.0', '')
        + 'K'
      );
    }

    return String(num);
  }


  /* ============================================================
     CATEGORY CSS CLASS
     ============================================================ */

  function catClass(category) {
    return `cat-${category || 'default'}`;
  }


  /* ============================================================
     ARTICLE CARD
     
     Uses the existing category-card design but now receives
     real Django Article API data.
     ============================================================ */

  function tplStandard(item) {

    const imageHtml = item.image
      ? `
        <img
          src="${item.image}"
          alt="${item.headline || ''}"
          loading="lazy"
        >
      `
      : `
        <div
          class="d-flex align-items-center justify-content-center bg-light"
          style="height:100%; min-height:180px;"
        >
          <i
            class="bi bi-image"
            style="font-size:42px; opacity:.35;"
            aria-hidden="true"
          ></i>
        </div>
      `;

    return `
      <a
        href="/article/${encodeURIComponent(item.slug)}/"
        class="card-mpb hover-lift text-decoration-none"
      >

        <div class="thumb">

          ${imageHtml}

          <span class="badge-cat ${catClass(item.category)}">
            ${item.catLabel || item.category || ''}
          </span>

          ${
            item.isBreaking
              ? `
                <span class="badge-live">
                  <span class="dot"></span>
                  LIVE
                </span>
              `
              : ''
          }

        </div>

        <div class="body">

          <h2 class="headline">
            ${item.headline || ''}
          </h2>

          <p class="summary">
            ${item.summary || ''}
          </p>

          <div class="meta-row">

            <span class="loc">
              <i class="bi bi-geo-alt"></i>
              ${item.district || ''}
            </span>

            <span>
              ${formatPublishedTime(item.publishedAt)}
            </span>

          </div>

          <div class="meta-row">

            <span class="stat-row">
              <span>
                <i class="bi bi-eye-fill"></i>
                ${fmtNum(item.views)}
              </span>
            </span>

          </div>

        </div>

      </a>
    `;
  }


  /* ============================================================
     DATE FORMATTER
     ============================================================ */

  function formatPublishedTime(value) {

    if (!value) {
      return '';
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return '';
    }

    return date.toLocaleDateString(
      'hi-IN',
      {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      }
    );
  }


  /* ============================================================
     RENDER CATEGORY
     ============================================================ */
  function renderCategoryTabs(categories) {

    const tabs =
        document.getElementById('categoryTabs');

    if (!tabs) {
        return;
    }

    const currentSlug =
        getCategorySlug();

    const allTab = `
        <a
            class="category-tab ${
                currentSlug === '' ? 'active' : ''
            }"
            data-category="all"
            href="/category/"
        >
            सभी खबरें
        </a>
    `;

    const categoryTabs = categories
        .map(category => {

            return `
                <a
                    class="category-tab ${
                        category.slug === currentSlug
                            ? 'active'
                            : ''
                    }"
                    data-category="${category.slug}"
                    href="/category/${encodeURIComponent(category.slug)}/"
                >
                    ${category.name}
                </a>
            `;

        })
        .join('');

    tabs.innerHTML =
        allTab + categoryTabs;
}
  async function fetchCategories() {

    const response = await fetch(
        '/api/categories/',
        {
            method: 'GET',
            credentials: 'same-origin',
            headers: {
                'Accept': 'application/json'
            }
        }
    );

    if (!response.ok) {
        throw new Error(
            `Categories API returned HTTP ${response.status}`
        );
    }

    const data = await response.json();

    if (!data.success) {
        throw new Error(
            'Categories API returned an unsuccessful response.'
        );
    }

    return data.items || [];
}
  async function renderCategory() {

    const slug = getCategorySlug();

    try {

      let categoryName = 'सभी खबरें';

      let categoryDescription =
        'THE MP BLAST की सभी प्रमुख और ताज़ा खबरें एक ही जगह।';

      let items = [];


      /* --------------------------------------------------------
         SPECIFIC CATEGORY
         
         Example:
         /category/mp/
         -------------------------------------------------------- */

      if (slug) {

    /*
     * Specific category
     *
     * Example:
     * /category/mp/
     */

    const categoryData =
        await fetchCategory(slug);

    if (!categoryData.success) {
        throw new Error(
            'Category was not found.'
        );
    }

    const category =
        categoryData.item ||
        categoryData.category;

    if (!category) {
        throw new Error(
            'Category data is missing from API response.'
        );
    }

    categoryName =
        category.name ||
        categoryName;

    categoryDescription =
        category.description ||
        categoryDescription;

    items =
        await fetchCategoryArticles(slug);

} else {

    /*
     * All News
     *
     * Example:
     * /category/
     *
     * Uses the general Article API.
     */

    items =
        await fetchAllArticles();
}

      /* --------------------------------------------------------
         CATEGORY TITLE
         -------------------------------------------------------- */

      const title =
        document.getElementById(
          'categoryTitle'
        );

      if (title) {
        title.textContent =
          categoryName;
      }


      /* --------------------------------------------------------
         CATEGORY DESCRIPTION
         -------------------------------------------------------- */

      const description =
        document.getElementById(
          'categoryDescription'
        );

      if (description) {

        description.textContent =
          categoryDescription;
      }


      /* --------------------------------------------------------
         ARTICLE COUNT
         -------------------------------------------------------- */

      const count =
        document.getElementById(
          'categoryCount'
        );

      if (count) {

        count.textContent =
          `${items.length} खबरें`;
      }


      /* --------------------------------------------------------
         ARTICLE GRID
         -------------------------------------------------------- */

      const slot =
        document.getElementById(
          'categoryNewsSlot'
        );

      if (slot) {

        if (items.length) {

          slot.innerHTML =
            items
              .map(tplStandard)
              .join('');

        } else {

          slot.innerHTML = `
            <div class="col-12">
              <div class="alert alert-light border">
                इस श्रेणी में अभी कोई खबर उपलब्ध नहीं है।
              </div>
            </div>
          `;
        }
      }


      /* --------------------------------------------------------
         ACTIVE CATEGORY TAB
         -------------------------------------------------------- */

  

    } catch (error) {

      console.error(
        'Category loading failed:',
        error
      );

      const slot =
        document.getElementById(
          'categoryNewsSlot'
        );

      if (slot) {

        slot.innerHTML = `
          <div class="col-12">
            <div class="alert alert-danger">
              खबरें लोड नहीं हो सकीं।
            </div>
          </div>
        `;
      }
    }
  }


  /* ============================================================
     TODAY'S DATE
     ============================================================ */

  function setTodayDate() {

    const el =
      document.getElementById(
        'todayDate'
      );

    if (!el) {
      return;
    }

    const days = [
      "रविवार",
      "सोमवार",
      "मंगलवार",
      "बुधवार",
      "गुरुवार",
      "शुक्रवार",
      "शनिवार"
    ];

    const months = [
      "जनवरी",
      "फ़रवरी",
      "मार्च",
      "अप्रैल",
      "मई",
      "जून",
      "जुलाई",
      "अगस्त",
      "सितंबर",
      "अक्टूबर",
      "नवंबर",
      "दिसंबर"
    ];

    const d = new Date();

    el.textContent =
      `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }


  /* ============================================================
     BACK TO TOP
     ============================================================ */

  function initBackToTop() {

    const btn =
      document.getElementById(
        'backToTop'
      );

    if (!btn) {
      return;
    }

    window.addEventListener(
      'scroll',
      () => {
        btn.classList.toggle(
          'show',
          window.scrollY > 500
        );
      }
    );

    btn.addEventListener(
      'click',
      () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      }
    );
  }


  /* ============================================================
     PAGE INITIALIZATION
     ============================================================ */

document.addEventListener(
    'DOMContentLoaded',
    async () => {

        setTodayDate();

        initBackToTop();

        try {

            const categories =
                await fetchCategories();

            renderCategoryTabs(categories);

            await renderCategory();

        } catch (error) {

            console.error(
                'Category page initialization failed:',
                error
            );

        }

    }
);

</script>

{% endblock %}
